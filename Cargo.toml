[package]
name = "AutoRecordOBS"
version = "2.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.39" 
tray-icon = "0.24"
tao = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.56"
directories = "6.0"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Foundation"] }

[build-dependencies]
winres = "0.1"